[package]
name = "polystar-control-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"

embedded-hal = {
    version = "0.2.6",
    features = [
        "unproven"
    ]
}

fdcan = "0.2.1"
libm = "0.2.16"
panic-probe = {
    version = "1.0.0",
    features = [
        "print-defmt"
    ]
}    
rtic = { 
    version = "2.3.1",
    features = [
        "thumbv7-backend"
    ]
}
rtic-monotonics = {
    version = "2.2.1",
    features = [
        "cortex-m-systick"
    ]
}
stm32h7xx-hal = { 
    version = "0.16.0", 
    features = [
        "stm32h735",
        "rt",
        "can"
    ]
}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[[bin]]
name = "polystar-control-rs"
path = "src/main.rs"
test = false
doctest = false
bench = false
